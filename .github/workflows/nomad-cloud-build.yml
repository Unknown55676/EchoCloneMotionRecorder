name: Nomad cloud build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "build/contracts/**"
      - "tools/package-mod.ps1"
      - ".github/workflows/nomad-cloud-build.yml"
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "build/contracts/**"
      - "tools/package-mod.ps1"
      - ".github/workflows/nomad-cloud-build.yml"

permissions:
  contents: read

jobs:
  core-checks:
    name: Build and test motion recorder core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build core
        run: dotnet build src/EchoCloneMotionRecorder/EchoCloneMotionRecorder.csproj --configuration Release
      - name: Run core checks
        run: dotnet run --project tests/EchoCloneMotionRecorder.CoreChecks/EchoCloneMotionRecorder.CoreChecks.csproj --configuration Release

  nomad-plugin:
    name: Compile and package Nomad test candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Check for optional exact game references
        id: refs
        shell: bash
        env:
          THUNDERROAD_DLL_B64: ${{ secrets.NOMAD_THUNDERROAD_DLL_B64 }}
          UNITY_DLL_B64: ${{ secrets.NOMAD_UNITYENGINE_COREMODULE_DLL_B64 }}
        run: |
          if [ -n "$THUNDERROAD_DLL_B64" ] && [ -n "$UNITY_DLL_B64" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Exact game DLLs are not configured; using build-only API contracts. Result is a test candidate, not Quest-verified."
          fi

      - name: Restore exact game references from private repository secrets
        if: steps.refs.outputs.available == 'true'
        shell: bash
        env:
          THUNDERROAD_DLL_B64: ${{ secrets.NOMAD_THUNDERROAD_DLL_B64 }}
          UNITY_DLL_B64: ${{ secrets.NOMAD_UNITYENGINE_COREMODULE_DLL_B64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/nomad-managed"
          printf '%s' "$THUNDERROAD_DLL_B64" | base64 --decode > "$RUNNER_TEMP/nomad-managed/ThunderRoad.dll"
          printf '%s' "$UNITY_DLL_B64" | base64 --decode > "$RUNNER_TEMP/nomad-managed/UnityEngine.CoreModule.dll"
          test -s "$RUNNER_TEMP/nomad-managed/ThunderRoad.dll"
          test -s "$RUNNER_TEMP/nomad-managed/UnityEngine.CoreModule.dll"

      - name: Build plugin against exact game references
        if: steps.refs.outputs.available == 'true'
        run: dotnet build src/EchoCloneMotionRecorder.Nomad/EchoCloneMotionRecorder.Nomad.csproj --configuration Release -p:UseNomadApiContracts=false -p:NomadManagedDir="$RUNNER_TEMP/nomad-managed"

      - name: Build plugin against compile-time API contracts
        if: steps.refs.outputs.available != 'true'
        run: dotnet build src/EchoCloneMotionRecorder.Nomad/EchoCloneMotionRecorder.Nomad.csproj --configuration Release -p:UseNomadApiContracts=true

      - name: Package candidate ZIP (exact references)
        if: steps.refs.outputs.available == 'true'
        shell: pwsh
        run: ./tools/package-mod.ps1 -BuildConfiguration Release -ReferenceMode Exact

      - name: Package candidate ZIP (compile-time contracts)
        if: steps.refs.outputs.available != 'true'
        shell: pwsh
        run: ./tools/package-mod.ps1 -BuildConfiguration Release -ReferenceMode Contract

      - name: Upload test candidate
        uses: actions/upload-artifact@v4
        with:
          name: EchoCloneMotionRecorder-Nomad-candidate
          path: artifacts/EchoCloneMotionRecorder-Nomad.zip
          if-no-files-found: error
          retention-days: 14
