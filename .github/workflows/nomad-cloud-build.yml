name: Nomad cloud build

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/nomad-cloud-build.yml"

permissions:
  contents: read

jobs:
  core-checks:
    name: Build and test game-independent core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build core
        run: dotnet build src/EchoCloneMotionRecorder/EchoCloneMotionRecorder.csproj --configuration Release
      - name: Run core checks
        run: dotnet run --project tests/EchoCloneMotionRecorder.CoreChecks/EchoCloneMotionRecorder.CoreChecks.csproj --configuration Release

  nomad-plugin:
    name: Compile Nomad plugin and package mod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for private game references
        id: refs
        env:
          THUNDERROAD_DLL_B64: ${{ secrets.NOMAD_THUNDERROAD_DLL_B64 }}
          UNITY_DLL_B64: ${{ secrets.NOMAD_UNITYENGINE_COREMODULE_DLL_B64 }}
        run: |
          if [ -n "$THUNDERROAD_DLL_B64" ] && [ -n "$UNITY_DLL_B64" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Plugin build skipped: private DLL secrets are not configured. Core tests still run."
          fi
      - uses: actions/setup-dotnet@v4
        if: steps.refs.outputs.available == 'true'
        with:
          dotnet-version: "8.0.x"
      - name: Restore private game references from repository secrets
        if: steps.refs.outputs.available == 'true'
        env:
          THUNDERROAD_DLL_B64: ${{ secrets.NOMAD_THUNDERROAD_DLL_B64 }}
          UNITY_DLL_B64: ${{ secrets.NOMAD_UNITYENGINE_COREMODULE_DLL_B64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/nomad-managed"
          printf '%s' "$THUNDERROAD_DLL_B64" | base64 --decode > "$RUNNER_TEMP/nomad-managed/ThunderRoad.dll"
          printf '%s' "$UNITY_DLL_B64" | base64 --decode > "$RUNNER_TEMP/nomad-managed/UnityEngine.CoreModule.dll"
          test -s "$RUNNER_TEMP/nomad-managed/ThunderRoad.dll"
          test -s "$RUNNER_TEMP/nomad-managed/UnityEngine.CoreModule.dll"
      - name: Build Nomad plugin against supplied game assemblies
        if: steps.refs.outputs.available == 'true'
        run: dotnet build src/EchoCloneMotionRecorder.Nomad/EchoCloneMotionRecorder.Nomad.csproj --configuration Release -p:NomadManagedDir="$RUNNER_TEMP/nomad-managed"
      - name: Package installable ZIP
        if: steps.refs.outputs.available == 'true'
        shell: pwsh
        run: ./tools/package-mod.ps1 -Configuration Release
      - name: Upload ZIP artifact
        if: steps.refs.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: EchoCloneMotionRecorder-Nomad
          path: artifacts/EchoCloneMotionRecorder-Nomad.zip
          if-no-files-found: error
          retention-days: 14
