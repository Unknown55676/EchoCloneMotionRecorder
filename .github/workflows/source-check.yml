name: Source validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Check required project files and project XML
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f docs/TECHNICAL_PLAN.md
          test -f docs/QUEST_ONLY_WORKFLOW.md
          test -f docs/REMOTE_BUILD_AND_DEVICE_CONNECTION.md
          test -f src/EchoCloneMotionRecorder/MotionFrame.cs
          test -f src/EchoCloneMotionRecorder/MotionRecording.cs
          test -f src/EchoCloneMotionRecorder/MotionPlayback.cs
          test -f docs/SDK_INTEGRATION_NOTES.md
          test -f src/EchoCloneMotionRecorder.Nomad/README.md
          test -f src/EchoCloneMotionRecorder.Nomad/BUILDING.md
          test -f src/EchoCloneMotionRecorder.Nomad/EchoCloneThunderScript.cs
          test -f src/EchoCloneMotionRecorder.Nomad/EchoCloneMotionRecorder.Nomad.csproj
          test -f src/EchoCloneMotionRecorder.Nomad/manifest.json
          test -f tests/EchoCloneMotionRecorder.CoreChecks/Program.cs
          test -f tests/EchoCloneMotionRecorder.CoreChecks/EchoCloneMotionRecorder.CoreChecks.csproj
          python3 - <<'PY'
          import json
          import xml.etree.ElementTree as ET

          ET.parse("src/EchoCloneMotionRecorder.Nomad/EchoCloneMotionRecorder.Nomad.csproj")
          ET.parse("src/EchoCloneMotionRecorder/EchoCloneMotionRecorder.csproj")
          with open("src/EchoCloneMotionRecorder.Nomad/manifest.json", encoding="utf-8") as file:
              manifest = json.load(file)
          required = ("Name", "Description", "Author", "ModVersion", "GameVersion")
          missing = [key for key in required if not manifest.get(key)]
          if missing:
              raise SystemExit("Manifest missing required fields: " + ", ".join(missing))
          print("Project XML and manifest JSON parse successfully.")

          # Guard the game-side integration against accidentally reverting to a
          # logging-only scaffold. This is a source check, not a substitute for
          # compiling against the proprietary target-game assemblies.
          with open("src/EchoCloneMotionRecorder.Nomad/EchoCloneThunderScript.cs", encoding="utf-8") as file:
              plugin = file.read()
          required_plugin_tokens = (
              "SpawnEchoCloneOption",
              "RecordMotionOption",
              "StopRecordingOption",
              "PlaybackOption",
              "HostileModeOption",
              "Catalog.GetData<CreatureData>",
              ".SpawnAsync(",
              "recording.TryAddFrame(frame)",
              "playback.TryGetCurrentFrame",
              "Player.local",
          )
          missing_plugin_tokens = [token for token in required_plugin_tokens if token not in plugin]
          if missing_plugin_tokens:
              raise SystemExit("Nomad gameplay source missing: " + ", ".join(missing_plugin_tokens))
          print("Nomad gameplay source contains spawn, recording, playback, and option entry points.")
          PY
          echo "Required source, test, and integration files are present."

      - name: Build game-independent recorder core
        run: dotnet build src/EchoCloneMotionRecorder/EchoCloneMotionRecorder.csproj --configuration Release

      - name: Run recorder core checks
        run: dotnet run --project tests/EchoCloneMotionRecorder.CoreChecks/EchoCloneMotionRecorder.CoreChecks.csproj --configuration Release
