name: Source validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check required project files
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f docs/TECHNICAL_PLAN.md
          test -f docs/QUEST_ONLY_WORKFLOW.md
          test -f src/EchoCloneMotionRecorder/MotionFrame.cs
          echo "Required planning and source files are present."
          echo "This workflow does not compile or validate a game plugin."
